<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly Trader</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage"></main>

  <section id="account" class="card">
    <div class="label">🪰 Fly's account</div>
    <div id="fly-return" class="big">+0.0%</div>
    <div id="equity" class="sub">$10,000</div>
    <div class="row"><span class="label">Buy &amp; hold</span><span id="hold-return">+0.0%</span></div>
    <div class="row"><span class="label" id="day-label">Day 1 / 60</span><span id="trades">0 trades</span></div>
    <ol id="log"></ol>
  </section>

  <section id="brain" class="card">
    <div class="title">Inside the fly brain</div>
    <div class="label" id="brain-sub"></div>
    <canvas id="brain-canvas"></canvas>
    <div class="meter sugar"><span>Sweet</span><i><b></b></i><em></em></div>
    <div class="meter bitter"><span>Bitter</span><i><b></b></i><em></em></div>
    <div class="meter mn9"><span>MN9</span><i><b></b></i><em></em></div>
    <div class="label" id="decision"></div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
